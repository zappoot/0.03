<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиоплеер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1e1e1e;
        }
        .player-card {
            background: #2d2d2d;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            width: 350px;
        }
        .cover {
            width: 200px;
            height: 200px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        /* Стилизация самого плеера (для Chrome/Safari) */
        audio::-webkit-media-controls-panel {
            background-color: #3a3a3a;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #e0e0e0;
        }
        audio::-webkit-media-controls-play-button {
            background-color: #555;
            border-radius: 50%;
        }
        h2 {
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        p {
            color: #999;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="player-card">
        <!-- КАРТИНКА -->
        <img class="cover" src="image.png" alt="Обложка трека">
        
        <h2>🎵 Listen to the audio</h2>
        
        <audio controls>
            <source src="050_SO3_A1_SB_3B_Audio_3_03.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоплеер
        </audio>
    </div>
</body>
</html>
