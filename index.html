<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиоплеер — как в Яндекс Музыке</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #1e1e1e;
        }
        .player-card {
            background: #d3d3d3;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            width: 500px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .cover {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .info {
            flex: 1;
            min-width: 0;
        }
        h2 {
            color: #e0e0e0;
            font-size: 16px;
            font-weight: 500;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist {
            color: #999;
            font-size: 13px;
            margin: 0 0 12px 0;
        }
        audio {
            width: 100%;
            height: 40px;
        }
        /* Стилизация плеера */
        audio::-webkit-media-controls-panel {
            background-color: #3a3a3a;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #e0e0e0;
        }
        audio::-webkit-media-controls-play-button {
            background-color: #555;
            border-radius: 50%;
        }
        audio::-webkit-media-controls-volume-slider {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="player-card">
        <!-- КАРТИНКА СЛЕВА -->
        <img class="cover" src="image.png" alt="Обложка трека">
        
        <div class="info">
            <h2>Listen to the audio</h2>
            <p class="artist">Audio track</p>
            <audio controls>
                <source src="050_SO3_A1_SB_3B_Audio_3_03.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудиоплеер
            </audio>
        </div>
    </div>
</body>
</html>
